name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
    # Pushes that only change these files don't affect the site, so skip deploying.
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm          # reuse downloaded packages between runs
      - run: npm ci           # fast, exact install from package-lock.json
      - uses: actions/cache@v4
        with:
          # Next.js build cache: lets the build reuse work from the previous run
          path: .next/cache
          key: nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: |
            nextjs-${{ hashFiles('package-lock.json') }}-
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
